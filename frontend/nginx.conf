server {
    listen 80;

    # Gestion du Frontend (Application React buildée)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # CORRECTION : REDIRECTION VERS LE BACKEND
    # ==========================================
    # Tout ce qui va vers /api/ doit être envoyé au conteneur "backend"
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Redirection pour les images/uploads stockées sur le backend
    location /uploads {
        proxy_pass http://backend:5000;
    }

    # Gestion des erreurs Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}