server {
    listen 80;
    server_name localhost;

    # 1. Gestion du Frontend (Application React compilée)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial pour react-router-dom : redirige les routes vers index.html
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy d'API : Redirection des requêtes vers le conteneur Backend
    location /api/ {
        proxy_pass http://backend:5000; # Ne pas oublier le ';' à la fin
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Options de sécurité et de transmission d'IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Gestion des fichiers d'images téléversés (Uploads)
    location /uploads/ {
        proxy_pass http://backend:5000;
    }

    # Gestion des erreurs Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}