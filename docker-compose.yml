services:
  mongo:
    image: mongo:6
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - ./mongo-data:/data/db
    networks:
      - proshop-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: proshop-backend:latest
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/proshop
      JWT_SECRET: abc123
      PAYPAL_CLIENT_ID: sb
    depends_on:
      - mongo
    networks:
      - proshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: proshop-frontend:latest
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - proshop-network

  prometheus:
    image: prom/prometheus
    user: 'root'
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/tmp/prometheus' # Évite les conflits d'écriture sur le workspace Jenkins
    networks:
      - proshop-network

  grafana:
    image: grafana/grafana
    restart: always
    ports:
      - '3001:3000'
    networks:
      - proshop-network

  node-exporter:
    image: prom/node-exporter
    restart: always
    ports:
      - '9100:9100'
    networks:
      - proshop-network

networks:
  proshop-network:
    driver: bridge
