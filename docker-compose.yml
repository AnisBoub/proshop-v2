services:
  mongo:
    image: mongo:6
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db # Nettoyé : Utilise un volume Docker sécurisé
    networks:
      - proshop-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: proshop-backend:latest
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/proshop
      JWT_SECRET: abc123
      PAYPAL_CLIENT_ID: sb
    depends_on:
      - mongo
    networks:
      - proshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: proshop-frontend:latest
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - proshop-network

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    image: proshop-prometheus:latest # Utilise votre image packagée sans volume !
    user: 'root'
    restart: always
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - proshop-network

  grafana:
    image: grafana/grafana
    restart: always
    ports:
      - '3001:3000'
    volumes:
      - grafana-storage:/var/lib/grafana # Nouveau : Sauvegarde vos dashboards automatiquement !
    networks:
      - proshop-network

  node-exporter:
    image: prom/node-exporter
    restart: always
    ports:
      - '9100:9100'
    networks:
      - proshop-network

networks:
  proshop-network:
    driver: bridge

volumes:
  mongo-data: # Déclaration du volume pour MongoDB
  grafana-storage: # Déclaration du volume pour Grafana
