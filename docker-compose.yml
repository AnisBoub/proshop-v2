version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo
    networks:
      proshop-network:
        aliases:
          - mongo
    # ... reste de votre config (ports, volumes)

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/proshop
    networks:
      proshop-network:
        aliases:
          - backend
    # ... reste de votre config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - '3000:80'
    networks:
      proshop-network:
        aliases:
          - frontend
    depends_on:
      - backend

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile.prometheus
    container_name: prometheus
    ports:
      - '9090:9090'
    networks:
      proshop-network:
        aliases:
          - prometheus

networks:
  proshop-network:
    driver: bridge
