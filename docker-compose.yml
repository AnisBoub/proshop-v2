services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - proshop-network

  backend:
  image: proshop-backend:latest
  environment:
    - NODE_ENV=production
    - PORT=5000
    - MONGO_URI=mongodb://mongo:27017/proshop
    # Si votre framework utilise une variable HOST :
    - HOST=0.0.0.0
  ports:
    - '5000:5000'
  networks:
    - proshop-network

  frontend:
    image: proshop-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - proshop-network

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    image: proshop-prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    networks:
      - proshop-network
    restart: always
    # IMPORTANT : Supprimez ou commentez la ligne volumes ci-dessous s'il y en avait une !
    # volumes:
    #   - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

networks:
  proshop-network:
    driver: bridge

volumes:
  mongo_data:
